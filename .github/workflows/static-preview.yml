name: Static Preview

on:
  push:
    branches:
      - preview/mvp-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run typecheck
          npm test
      - name: Build web
        run: npm run build:web
      - name: Make exported paths portable
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const htmlPath = path.join('dist', 'index.html');
          let html = fs.readFileSync(htmlPath, 'utf8');
          html = html.replaceAll('href="/', 'href="./').replaceAll('src="/', 'src="./');
          fs.writeFileSync(htmlPath, html);
          const jsDir = path.join('dist', '_expo', 'static', 'js', 'web');
          for (const file of fs.readdirSync(jsDir).filter(name => name.endsWith('.js'))) {
            const filePath = path.join(jsDir, file);
            let js = fs.readFileSync(filePath, 'utf8');
            js = js.replaceAll('="/assets/', '="./assets/');
            fs.writeFileSync(filePath, js);
          }
          NODE
          touch dist/.nojekyll
      - name: Publish preview-site branch
        run: |
          mkdir -p /tmp/medical-toolbox-preview
          cp -a dist/. /tmp/medical-toolbox-preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview-site-tmp
          git rm -rf .
          cp -a /tmp/medical-toolbox-preview/. .
          git add -f .
          git commit -m "preview: publish Medical Toolbox web build"
          git push --force origin HEAD:preview-site
